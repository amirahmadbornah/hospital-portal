# -----------------------------------------------------------------------
# Sample Nginx server block for the Hospital Internal Portal (v12)
#
# Install:
#   1. Copy the "Portal" folder to /var/www/portal on the Ubuntu server.
#   2. Copy this file to /etc/nginx/sites-available/portal
#   3. sudo ln -s /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/portal
#   4. Add "portal" (and/or "portal.local") to DNS or to every client's
#      hosts file, pointing at this server's IP.
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Because there is no build step, every edit made directly to files in
# /var/www/portal is served immediately. The cache rules below make
# sure staff browsers always revalidate data/*.json (so link changes,
# announcements and config updates show up right away) while still
# allowing static assets to be cached briefly for speed.
# -----------------------------------------------------------------------

server {
    listen 80;
    server_name portal portal.local;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for fast first paint
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Never cache the HTML shell itself.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # JSON content must always be revalidated: this is how the portal
    # publishes new links, announcements or config with zero downtime.
    location /data/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # PWA: the service worker file itself must never be cached, or
    # browsers may keep running an old worker for a very long time and
    # never discover a new deployment.
    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # CSS/JS/fonts/icons are versioned via ?v= query strings in index.html,
    # so they are safe to cache for a short period; a version bump on
    # deploy naturally busts the cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /favicon/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------
    # Admin panel (v12.3.0) — requires PHP-FPM. Install it first:
    #   sudo apt install php-fpm php-json
    # Confirm the socket path below matches your PHP version, e.g.
    # /run/php/php8.3-fpm.sock — check with: ls /run/php/
    # -------------------------------------------------------------------

    # config/ holds the admin password hash. It is never meant to be
    # requested directly (api/*.php only ever `require`s it server-side)
    # — block it outright as defense in depth.
    location /config/ {
        deny all;
        return 403;
    }

    # Automatic backups and the audit log must never be downloadable.
    location /data/backups/ {
        deny all;
        return 403;
    }
    location = /data/audit.log {
        deny all;
        return 403;
    }

    # v2.0: uploaded announcement images. Served as plain static files
    # only — every filename here was server-generated by
    # api/announcement.php's upload handler (random hex + a validated
    # extension), never derived from user input, so there is nothing
    # to execute and nothing path-traversal-able. Cached aggressively
    # since a given filename's content never changes (a new upload
    # always gets a brand-new random filename).
    location /data/uploads/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # The admin panel itself must never be cached by Nginx or the
    # browser at the HTTP layer — the service worker already excludes
    # it too (see service-worker.js), this is defense in depth.
    location /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # API responses must never be cached anywhere, and PHP files must
    # be handed off to PHP-FPM instead of served as static text.
    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        location ~ \.php$ {
            fastcgi_pass portal-php:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        }
    }

    # admin/*.php (currently only generate-password-hash.php, which is
    # CLI-only and refuses to run under a web server anyway) still gets
    # routed to PHP-FPM so it 403s cleanly instead of leaking source.
    location ~ ^/admin/.*\.php$ {
        fastcgi_pass portal-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers — appropriate for an internal LAN deployment
    # that now also includes an authenticated admin panel under /admin/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
